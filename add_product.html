<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Product - AI Shelf Life</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background-color: #f4f6f9; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }

        /* 🟢 VERTICAL SIDEBAR MENU */
        .sidebar {
            width: 250px;
            height: 100vh;
            position: fixed;
            top: 0;
            left: 0;
            background-color: #1b5e20;
            color: white;
            padding-top: 20px;
            z-index: 1000;
        }

        .sidebar .brand-title {
            font-size: 1.3rem;
            font-weight: bold;
            padding: 10px 20px;
            color: #ffffff;
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
            margin-bottom: 20px;
            text-align: center;
        }

        .sidebar-menu {
            display: flex;
            flex-direction: column;
            gap: 8px;
            padding: 0 15px;
            list-style: none;
        }

        .sidebar-menu a {
            color: #e8f5e9;
            text-decoration: none;
            font-size: 1rem;
            padding: 12px 18px;
            display: flex;
            align-items: center;
            gap: 12px;
            border-radius: 8px;
            transition: all 0.2s ease-in-out;
        }

        .sidebar-menu a:hover, .sidebar-menu a.active {
            background-color: #2e7d32;
            color: #ffffff;
            font-weight: bold;
        }

        /* 🔵 MAIN CONTENT AREA */
        .main-content {
            margin-left: 250px;
            padding: 30px;
        }

        @media (max-width: 768px) {
            .sidebar { width: 100%; height: auto; position: relative; }
            .main-content { margin-left: 0; }
        }
    </style>
</head>
<body>

    <div class="sidebar">
        <div class="brand-title">
            🌱 AI Shelf Life
        </div>
        
        <ul class="sidebar-menu">
            <li>
                <a href="{{ url_for('dashboard') }}">
                    <i class="fa-solid fa-chart-line"></i> Dashboard
                </a>
            </li>
            <li>
                <a href="{{ url_for('add_product') }}" class="active">
                    <i class="fa-solid fa-plus-circle"></i> Add Product
                </a>
            </li>
            <li>
                <a href="{{ url_for('product_list') }}">
                    <i class="fa-solid fa-list-check"></i> Product List
                </a>
            </li>
            <li>
                <a href="{{ url_for('ai_prediction') }}">
                    <i class="fa-solid fa-robot"></i> AI Prediction
                </a>
            </li>
            <li>
                <a href="{{ url_for('notifications') }}">
                    <i class="fa-solid fa-bell"></i> Notifications
                </a>
            </li>
            <li>
                <a href="{{ url_for('profile') }}">
                    <i class="fa-solid fa-user"></i> Profile
                </a>
            </li>
            <li style="margin-top: 30px;">
                <a href="{{ url_for('login') }}" style="color: #ffc107;">
                    <i class="fa-solid fa-right-from-bracket"></i> Logout
                </a>
            </li>
        </ul>
    </div>

    <div class="main-content">
        <h3 class="fw-bold text-dark mb-4"><i class="fa-solid fa-plus-circle me-2 text-success"></i>Add Product</h3>
        
        <div class="card p-4 shadow-sm border-0" style="max-width: 650px; border-radius: 12px; background: white;">
            <form action="{{ url_for('add_product') }}" method="POST" enctype="multipart/form-data">
                <div class="mb-3">
                    <label class="form-label fw-semibold">Product Name</label>
                    <input type="text" name="name" class="form-control" placeholder="e.g. Milk, Apple, Bread" required>
                </div>
                
                <div class="mb-3">
                    <label class="form-label fw-semibold">Category</label>
                    <select name="category" class="form-select">
                        <option value="Dairy">Dairy</option>
                        <option value="Bakery">Bakery</option>
                        <option value="Fruits">Fruits</option>
                        <option value="Vegetables">Vegetables</option>
                    </select>
                </div>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label fw-semibold">Manufacturing Date</label>
                        <input type="date" name="mfg_date" class="form-control" required>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label fw-semibold">Expiry Date</label>
                        <input type="date" name="exp_date" class="form-control" required>
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-semibold">Storage Type</label>
                    <select name="storage_type" class="form-select">
                        <option value="Refrigerator">Refrigerator</option>
                        <option value="Room Temperature">Room Temperature</option>
                        <option value="Freezer">Freezer</option>
                    </select>
                </div>

                <button type="submit" class="btn btn-success w-100 py-2 fw-bold mt-2"><i class="fa-solid fa-floppy-disk me-1"></i> Save Product</button>
            </form>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
