<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Product - AI Shelf Life Predictor</title>

    <!-- Bootstrap 5 CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        body {
            background-color: #f1f5f9;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            padding: 30px;
        }
        .card-custom {
            border: none;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.04);
            background: #ffffff;
        }
    </style>
</head>
<body>

<div class="container-fluid" style="max-width: 700px;">
    <!-- Page Header -->
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h3 class="fw-bold text-dark mb-1">Add New Product</h3>
            <p class="text-muted small mb-0">Enter product details to track expiry and storage status.</p>
        </div>
        <a href="/product-list" class="btn btn-outline-secondary rounded-pill btn-sm px-3">
            <i class="fa-solid fa-arrow-left me-1"></i> Back to List
        </a>
    </div>

    <!-- Add Product Form Card -->
    <div class="card card-custom p-4">
        <form action="/add-product" method="POST" enctype="multipart/form-data">
            <div class="mb-3">
                <label class="form-label small fw-semibold">Product Name</label>
                <input type="text" name="product_name" class="form-control" placeholder="e.g., Fresh Apples, Whole Milk" required>
            </div>

            <div class="row g-3 mb-3">
                <div class="col-md-6">
                    <label class="form-label small fw-semibold">Category</label>
                    <select name="category" class="form-select" required>
                        <option value="" selected disabled>Select Category</option>
                        <option value="Fruits & Vegetables">Fruits & Vegetables</option>
                        <option value="Dairy & Eggs">Dairy & Eggs</option>
                        <option value="Bakery">Bakery</option>
                        <option value="Meat & Seafood">Meat & Seafood</option>
                        <option value="Beverages">Beverages</option>
                        <option value="Others">Others</option>
                    </select>
                </div>
                <div class="col-md-6">
                    <label class="form-label small fw-semibold">Quantity</label>
                    <input type="text" name="quantity" class="form-control" placeholder="e.g., 1 kg, 2 Liters" required>
                </div>
            </div>

            <div class="row g-3 mb-3">
                <div class="col-md-6">
                    <label class="form-label small fw-semibold">Purchase / Stock Date</label>
                    <input type="date" name="purchase_date" class="form-control" required>
                </div>
                <div class="col-md-6">
                    <label class="form-label small fw-semibold">Expiry Date</label>
                    <input type="date" name="expiry_date" class="form-control" required>
                </div>
            </div>

            <div class="mb-4">
                <label class="form-label small fw-semibold">Upload Product Image (Optional)</label>
                <input type="file" name="image" class="form-control" accept="image/*">
            </div>

            <button type="submit" class="btn btn-success w-100 rounded-pill py-2 fw-semibold">
                <i class="fa-solid fa-plus me-2"></i>Save Product
            </button>
        </form>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
