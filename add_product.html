<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Product - AI Shelf Life Predictor</title>
    <!-- Bootstrap 5 CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        body {
            background-color: #f8fafc;
            font-family: 'Segoe UI', system-ui, sans-serif;
            margin: 0;
            padding: 0;
        }
        .sidebar {
            width: 250px;
            height: 100vh;
            position: fixed;
            top: 0;
            left: 0;
            background: #1e293b;
            color: #ffffff;
            padding: 20px 15px;
            display: flex;
            flex-direction: column;
            z-index: 1000;
        }
        .sidebar-brand {
            font-size: 1.25rem;
            font-weight: bold;
            color: #10b981;
            margin-bottom: 25px;
            text-align: center;
            text-decoration: none;
            display: block;
        }
        .sidebar a {
            color: #94a3b8;
            text-decoration: none;
            padding: 12px 15px;
            border-radius: 8px;
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 500;
            transition: all 0.2s;
        }
        .sidebar a:hover, .sidebar a.active {
            background: #334155;
            color: #ffffff;
        }
        .main-content {
            margin-left: 250px;
            padding: 35px;
            min-height: 100vh;
        }
        .card-custom {
            border: none;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            background: #ffffff;
        }
    </style>
</head>
<body>

    <!-- Sidebar Navigation -->
    <div class="sidebar">
        <a href="{{ url_for('dashboard') }}" class="sidebar-brand">🥦 AI Shelf Life</a>
        <a href="{{ url_for('dashboard') }}"><i class="fa-solid fa-chart-pie"></i> Dashboard</a>
        <a href="{{ url_for('add_product') }}" class="active"><i class="fa-solid fa-square-plus"></i> Add Product</a>
        <a href="{{ url_for('product_list') }}"><i class="fa-solid fa-list-check"></i> Product List</a>
        <a href="{{ url_for('ai_prediction') }}"><i class="fa-solid fa-robot"></i> AI Prediction</a>
        <a href="{{ url_for('chatbot') }}"><i class="fa-solid fa-comments"></i> AI Chatbot</a>
        <a href="{{ url_for('notifications') }}"><i class="fa-solid fa-bell"></i> Notifications</a>
        <a href="{{ url_for('profile') }}"><i class="fa-solid fa-user"></i> Profile</a>
        <a href="{{ url_for('admin') }}"><i class="fa-solid fa-gear"></i> Admin</a>
    </div>

    <!-- Main Content Area -->
    <div class="main-content">
        <h3 class="fw-bold text-dark mb-1">Add Product</h3>
        <p class="text-muted small mb-4">Enter product details to calculate and monitor shelf life.</p>

        <div class="card card-custom p-4" style="max-width: 550px;">
            <form action="{{ url_for('add_product') }}" method="POST">
                <div class="mb-3">
                    <label class="form-label fw-semibold text-dark">Product Name</label>
                    <input type="text" name="product_name" class="form-control" placeholder="e.g. Milk, Bread, Apple" required>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-semibold text-dark">Category</label>
                    <select name="category" class="form-select" required>
                        <option value="Dairy">Dairy</option>
                        <option value="Bakery">Bakery</option>
                        <option value="Fruits">Fruits</option>
                        <option value="Vegetables">Vegetables</option>
                        <option value="Beverages">Beverages</option>
                    </select>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-semibold text-dark">Manufacturing Date</label>
                    <input type="date" name="mfg_date" class="form-control" required>
                </div>

                <div class="mb-4">
                    <label class="form-label fw-semibold text-dark">Expiry Date</label>
                    <input type="date" name="expiry_date" class="form-control" required>
                </div>

                <button type="submit" class="btn btn-success w-100 py-2 fw-semibold" style="background-color: #0d9488; border: none;">
                    Save Product
                </button>
            </form>
        </div>
    </div>

    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
