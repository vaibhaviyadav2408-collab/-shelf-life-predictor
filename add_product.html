<!DOCTYPE html>
<html lang="en">
<head>
    <title>Add Product</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="sidebar">
        <h5 class="text-center mb-4">🥦 AI Shelf Life</h5>
        <a href="{{ url_for('dashboard') }}">📊 Dashboard</a>
        <a href="{{ url_for('add_product') }}" class="active">➕ Add Product</a>
        <a href="{{ url_for('product_list') }}">📋 Product List</a>
        <a href="{{ url_for('ai_prediction') }}">🤖 AI Prediction</a>
        <a href="{{ url_for('notifications') }}">🔔 Notifications</a>
        <a href="{{ url_for('profile') }}">👤 Profile</a>
        <a href="{{ url_for('admin') }}">⚙️ Admin</a>
    </div>
    <div class="main-content">
        <h3>Add Product</h3>
        <div class="card card-custom p-4 mt-3" style="max-width: 600px;">
            <form action="{{ url_for('add_product') }}" method="POST" enctype="multipart/form-data">
                <div class="mb-3"><label>Product Name</label><input type="text" class="form-control" required></div>
                <div class="mb-3"><label>Category</label>
                    <select class="form-select"><option>Dairy</option><option>Bakery</option><option>Fruits</option><option>Vegetables</option></select>
                </div>
                <div class="mb-3"><label>Manufacturing Date</label><input type="date" class="form-control" required></div>
                <div class="mb-3"><label>Expiry Date</label><input type="date" class="form-control" required></div>
                <button type="submit" class="btn btn-success w-100">Save Product</button>
            </form>
        </div>
    </div>
</body>
</html>
