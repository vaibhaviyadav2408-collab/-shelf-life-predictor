<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Product - AI Shelf Life Predictor</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        body {
            background-color: #f8fafc;
            font-family: 'Segoe UI', Roboto, sans-serif;
            margin: 0;
            padding: 0;
        }
        .sidebar {
            width: 250px;
            height: 100vh;
            position: fixed;
            top: 0;
            left: 0;
            background: #1e293b;
            color: #ffffff;
            padding: 20px 15px;
            display: flex;
            flex-direction: column;
            z-index: 1000;
        }
        .sidebar a {
            color: #94a3b8;
            text-decoration: none;
            padding: 12px 15px;
            border-radius: 8px;
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            font-weight: 500;
        }
        .sidebar a:hover, .sidebar a.active {
            background: #334155;
            color: #ffffff;
        }
        .main-content {
            margin-left: 250px;
            padding: 35px;
            min-height: 100vh;
        }
        .card-custom {
            border: none;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            background: #ffffff;
        }
    </style>
</head>
<body>

    <div class="sidebar">
        <h5 class="text-center mb-4 text-success fw-bold">🥦 AI Shelf Life</h5>
        <a href="{{ url_for('dashboard') }}">📊 Dashboard</a>
        <a href="{{ url_for('add_product') }}" class="active">➕ Add Product</a>
        <a href="{{ url_for('product_list') }}">📋 Product List</a>
        <a href="{{ url_for('ai_prediction') }}">🤖 AI Prediction</a>
        <a href="{{ url_for('chatbot') }}">💬 AI Chatbot</a>
        <a href="{{ url_for('notifications') }}">🔔 Notifications</a>
        <a href="{{ url_for('profile') }}">👤 Profile</a>
        <a href="{{ url_for('admin') }}">⚙️ Admin</a>
    </div>

    <div class="main-content">
        <h3 class="fw-bold text-dark">Add New Product</h3>
        <p class="text-muted small">Enter details to keep track of shelf life and expiry dates.</p>

        <div class="card card-custom p-4 mt-3" style="max-width: 600px;">
            <form action="{{ url_for('add_product') }}" method="POST" enctype="multipart/form-data">
                <div class="mb-3">
                    <label class="form-label fw-semibold">Product Name</label>
                    <input type="text" name="product_name" class="form-control" placeholder="e.g. Organic Milk" required>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-semibold">Category</label>
                    <select name="category" class="form-select" required>
                        <option value="Dairy">Dairy</option>
                        <option value="Bakery">Bakery</option>
                        <option value="Fruits">Fruits</option>
                        <option value="Vegetables">Vegetables</option>
                    </select>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-semibold">Manufacturing Date</label>
                    <input type="date" name="mfg_date" class="form-control" required>
                </div>

                <div class="mb-4">
                    <label class="form-label fw-semibold">Expiry Date</label>
                    <input type="date" name="expiry_date" class="form-control" required>
                </div>

                <button type="submit" class="btn btn-success w-100 fw-semibold py-2">Save Product</button>
            </form>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
