<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Profile - AI Shelf Life</title>
    <!-- Google Fonts & Font Awesome Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <style>
        .profile-card {
            max-width: 550px;
            margin: 0 auto;
            border-radius: 20px;
            border: 1px solid #e2e8f0;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.04);
            background: #ffffff;
        }
        .profile-avatar-container {
            position: relative;
            width: 120px;
            height: 120px;
            margin: 0 auto 20px auto;
        }
        .profile-avatar {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid #10b981;
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.2);
        }
        .camera-badge {
            position: absolute;
            bottom: 4px;
            right: 4px;
            background: #10b981;
            color: white;
            border-radius: 50%;
            width: 34px;
            height: 34px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.9rem;
            border: 3px solid #ffffff;
            cursor: pointer;
            transition: transform 0.2s ease;
        }
        .camera-badge:hover {
            transform: scale(1.1);
        }
        .form-control-custom {
            border-radius: 10px;
            border: 1px solid #cbd5e1;
            padding: 10px 14px;
            background-color: #f8fafc;
            font-size: 0.95rem;
        }
    </style>
</head>
<body>

    <!-- Sidebar Navigation -->
    <div class="sidebar">
        <div class="sidebar-brand">
            <i class="fa-solid fa-leaf text-success me-2"></i>AI Shelf Life
        </div>
        <a href="{{ url_for('dashboard') }}"><i class="fa-solid fa-chart-pie"></i> Dashboard</a>
        <a href="{{ url_for('add_product') }}"><i class="fa-solid fa-plus-circle"></i> Add Product</a>
        <a href="{{ url_for('product_list') }}"><i class="fa-solid fa-boxes-stacked"></i> Product List</a>
        <a href="{{ url_for('ai_prediction') }}"><i class="fa-solid fa-robot"></i> AI Prediction</a>
        <a href="{{ url_for('notifications') }}"><i class="fa-solid fa-bell"></i> Notifications</a>
        <a href="{{ url_for('profile') }}" class="active"><i class="fa-solid fa-user"></i> Profile</a>
        <a href="{{ url_for('admin') }}"><i class="fa-solid fa-gear"></i> Admin</a>
        <hr class="mx-3 text-muted opacity-25">
        <a href="{{ url_for('index') }}" class="text-danger fw-semibold"><i class="fa-solid fa-right-from-bracket"></i> Logout</a>
    </div>

    <!-- Main Content Area -->
    <div class="main-content">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h3 class="fw-bold mb-1">👤 User Profile</h3>
                <p class="text-muted mb-0">Manage your personal account details and preferences.</p>
            </div>
        </div>

        <div class="card profile-card p-4 p-md-5">
            <!-- Profile Avatar -->
            <div class="profile-avatar-container">
                <img src="https://api.dicebear.com/7.x/avataaars/svg?seed=Vaibhavi" class="profile-avatar bg-light" alt="User Avatar">
                <div class="camera-badge" title="Change Photo">
                    <i class="fa-solid fa-camera"></i>
                </div>
            </div>

            <!-- Profile Info Form -->
            <form>
                <div class="mb-3 text-start">
                    <label class="form-label text-muted small fw-semibold">
                        <i class="fa-regular fa-user me-1"></i> Full Name
                    </label>
                    <input type="text" class="form-control form-control-custom" value="{{ user.name if user else 'Vaibhavi Yadav' }}" readonly>
                </div>

                <div class="mb-3 text-start">
                    <label class="form-label text-muted small fw-semibold">
                        <i class="fa-regular fa-envelope me-1"></i> Email Address
                    </label>
                    <input type="email" class="form-control form-control-custom" value="{{ user.email if user else 'vaibhavi@gmail.com' }}" readonly>
                </div>

                <div class="mb-4 text-start">
                    <label class="form-label text-muted small fw-semibold">
                        <i class="fa-solid fa-mobile-screen-button me-1"></i> Mobile Number
                    </label>
                    <input type="text" class="form-control form-control-custom" value="{{ user.mobile if user else '9876543210' }}" readonly>
                </div>

                <!-- Action Buttons -->
                <div class="d-flex flex-wrap gap-3">
                    <button type="button" class="btn btn-green flex-grow-1 rounded-pill fw-semibold py-2">
                        <i class="fa-solid fa-user-pen me-1"></i> Edit Profile
                    </button>
                    <button type="button" class="btn btn-outline-secondary flex-grow-1 rounded-pill fw-semibold py-2">
                        <i class="fa-solid fa-key me-1"></i> Change Password
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
