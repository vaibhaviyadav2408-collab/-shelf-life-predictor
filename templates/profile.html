<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Profile - AI Shelf Life</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <style>
        .profile-card {
            max-width: 500px;
            margin: 0 auto;
            border-radius: 16px;
            border: none;
            box-shadow: 0 4px 20px rgba(0,0,0,0.05);
            background: #ffffff;
        }
        .profile-avatar-container {
            position: relative;
            width: 110px;
            height: 110px;
            margin: 0 auto 20px auto;
        }
        .profile-avatar {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #1d7a3e;
        }
        .camera-badge {
            position: absolute;
            bottom: 2px;
            right: 2px;
            background: #1d7a3e;
            color: white;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.8rem;
            border: 2px solid #ffffff;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="sidebar">
        <div class="sidebar-brand">🥦 AI Shelf Life</div>
        <a href="{{ url_for('dashboard') }}">📊 Dashboard</a>
        <a href="{{ url_for('add_product') }}">➕ Add Product</a>
        <a href="{{ url_for('product_list') }}">📋 Product List</a>
        <a href="{{ url_for('ai_prediction') }}">🤖 AI Prediction</a>
        <a href="{{ url_for('notifications') }}">🔔 Notifications</a>
        <a href="{{ url_for('profile') }}" class="active">👤 Profile</a>
        <a href="{{ url_for('admin') }}">⚙️ Admin</a>
        <hr class="mx-3 text-muted">
        <a href="{{ url_for('index') }}" class="text-danger">🚪 Logout</a>
    </div>

    <div class="main-content">
        <h3 class="fw-bold mb-4">User Profile</h3>

        <div class="card profile-card p-4">
            <div class="profile-avatar-container">
                <img src="https://api.dicebear.com/7.x/avataaars/svg?seed=Vaibhavi" class="profile-avatar bg-light" alt="User Avatar">
                <div class="camera-badge">📷</div>
            </div>

            <form>
                <div class="mb-3 text-start">
                    <label class="form-label text-muted small fw-semibold">Full Name</label>
                    <input type="text" class="form-control p-2" value="{{ user.name if user else 'Vaibhavi Yadav' }}" readonly>
                </div>

                <div class="mb-3 text-start">
                    <label class="form-label text-muted small fw-semibold">Email</label>
                    <input type="email" class="form-control p-2" value="{{ user.email if user else 'vaibhavi@gmail.com' }}" readonly>
                </div>

                <div class="mb-4 text-start">
                    <label class="form-label text-muted small fw-semibold">Mobile Number</label>
                    <input type="text" class="form-control p-2" value="{{ user.mobile if user else '9876543210' }}" readonly>
                </div>

                <div class="d-flex gap-3">
                    <button type="button" class="btn btn-green flex-grow-1">Edit Profile</button>
                    <button type="button" class="btn btn-outline-secondary flex-grow-1">Change Password</button>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
