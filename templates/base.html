<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}AI Shelf Life Predictor{% endblock %}</title>
    
    <!-- Google Fonts & Font Awesome Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

    <style>
        body {
            background-color: #f8fafc;
            font-family: 'Plus Jakarta Sans', sans-serif;
            margin: 0;
            padding: 0;
            color: #0f172a;
        }
        .sidebar {
            width: 260px;
            height: 100vh;
            position: fixed;
            top: 0;
            left: 0;
            background: #0f172a;
            color: #ffffff;
            padding: 24px 16px;
            display: flex;
            flex-direction: column;
            z-index: 1000;
            box-shadow: 4px 0 20px rgba(0, 0, 0, 0.05);
        }
        .sidebar-brand {
            font-size: 1.25rem;
            font-weight: 700;
            color: #10b981;
            margin-bottom: 32px;
            display: flex;
            align-items: center;
            padding-left: 8px;
            letter-spacing: -0.5px;
        }
        .sidebar a {
            color: #94a3b8;
            text-decoration: none;
            padding: 12px 16px;
            border-radius: 10px;
            margin-bottom: 4px;
            display: flex;
            align-items: center;
            font-weight: 500;
            font-size: 0.95rem;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .sidebar a:hover, .sidebar a.active {
            background: #1e293b;
            color: #10b981;
            transform: translateX(4px);
        }
        .main-content {
            margin-left: 260px;
            padding: 36px;
            min-height: 100vh;
        }
        .card-custom {
            border: 1px solid #e2e8f0;
            border-radius: 16px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.03);
            background: #ffffff;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        .card-custom:hover {
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.05);
        }
        .stat-icon {
            width: 48px;
            height: 48px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.25rem;
        }
    </style>
</head>
<body>

    <!-- Sidebar Layout -->
    <div class="sidebar">
        <div class="sidebar-brand">
            <i class="fa-solid fa-leaf me-2 text-success"></i> AI Shelf Life
        </div>
        
        <a href="{{ url_for('dashboard') }}" class="{% if request.endpoint == 'dashboard' %}active{% endif %}">
            <i class="fa-solid fa-chart-pie me-3"></i> Dashboard
        </a>
        <a href="{{ url_for('add_product') }}" class="{% if request.endpoint == 'add_product' %}active{% endif %}">
            <i class="fa-solid fa-plus-circle me-3"></i> Add Product
        </a>
        <a href="{{ url_for('product_list') }}" class="{% if request.endpoint == 'product_list' %}active{% endif %}">
            <i class="fa-solid fa-boxes-stacked me-3"></i> Product List
        </a>
        <a href="{{ url_for('ai_prediction') }}" class="{% if request.endpoint == 'ai_prediction' %}active{% endif %}">
            <i class="fa-solid fa-robot me-3"></i> AI Prediction
        </a>
        <a href="{{ url_for('notifications') }}" class="{% if request.endpoint == 'notifications' %}active{% endif %}">
            <i class="fa-solid fa-bell me-3"></i> Notifications
        </a>
        <a href="{{ url_for('profile') }}" class="{% if request.endpoint == 'profile' %}active{% endif %}">
            <i class="fa-solid fa-user me-3"></i> Profile
        </a>
        
        <a href="{{ url_for('index') }}" class="mt-auto text-danger fw-semibold">
            <i class="fa-solid fa-right-from-bracket me-3"></i> Logout
        </a>
    </div>

    <!-- Main Dynamic Content -->
    <div class="main-content">
        {% block content %}{% endblock %}
    </div>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
