<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Shelf Life Predictor</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        body {
            background-color: #f8fafc;
            font-family: 'Segoe UI', Roboto, sans-serif;
            margin: 0;
            padding: 0;
        }
        .sidebar {
            width: 250px;
            height: 100vh;
            position: fixed;
            top: 0;
            left: 0;
            background: #1e293b;
            color: #ffffff;
            padding: 20px 15px;
            display: flex;
            flex-direction: column;
            z-index: 1000;
        }
        .sidebar-brand {
            font-size: 1.3rem;
            font-weight: bold;
            color: #10b981;
            margin-bottom: 30px;
            display: flex;
            align-items: center;
        }
        .sidebar a {
            color: #94a3b8;
            text-decoration: none;
            padding: 12px 15px;
            border-radius: 8px;
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            font-weight: 500;
            transition: all 0.2s ease;
        }
        .sidebar a:hover, .sidebar a.active {
            background: #334155;
            color: #ffffff;
        }
        .main-content {
            margin-left: 250px;
            padding: 35px;
            min-height: 100vh;
        }
        .card-custom {
            border: none;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            background: #ffffff;
        }
        .stat-icon {
            width: 48px;
            height: 48px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.25rem;
        }
        .chart-container {
            width: 160px;
            height: 160px;
            border-radius: 50%;
            background: conic-gradient(#10b981 0% 66%, #f59e0b 66% 87%, #ef4444 87% 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: auto;
        }
        .chart-donut {
            width: 110px;
            height: 110px;
            background: #ffffff;
            border-radius: 50%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
    </style>
</head>
<body>

    <div class="sidebar">
        <div class="sidebar-brand">
            <i class="fa-solid fa-leaf me-2"></i> AI Shelf Life
        </div>
        <a href="/dashboard"><i class="fa-solid fa-chart-pie me-3"></i> Dashboard</a>
        <a href="/add-product"><i class="fa-solid fa-plus me-3"></i> Add Product</a>
        <a href="/product-list"><i class="fa-solid fa-list me-3"></i> Product List</a>
        <a href="/ai-prediction"><i class="fa-solid fa-robot me-3"></i> AI Prediction</a>
        <a href="/notifications"><i class="fa-solid fa-bell me-3"></i> Notifications</a>
        <a href="/profile"><i class="fa-solid fa-user me-3"></i> Profile</a>
        <a href="/logout" class="mt-auto text-danger"><i class="fa-solid fa-right-from-bracket me-3"></i> Logout</a>
    </div>

    <div class="main-content">
        {% block content %}{% endblock %}
    </div>

</body>
</html>
