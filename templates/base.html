<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}AI Shelf Life Predictor{% endblock %}</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}?v=4.0">
    <style>
        body {
            background-color: #f8fafc;
            font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
            margin: 0;
            padding: 0;
        }
        .dashboard-container {
            display: flex;
            min-height: 100vh;
        }
        /* Sidebar Styling */
        .sidebar {
            width: 250px;
            height: 100vh;
            background-color: #ffffff;
            border-right: 1px solid #e2e8f0;
            position: fixed;
            top: 0;
            left: 0;
            padding: 24px 16px;
            z-index: 1000;
            display: flex;
            flex-direction: column;
        }
        .sidebar-brand {
            font-weight: 800;
            font-size: 1.25rem;
            color: #047857;
            padding: 0 12px 16px 12px;
            border-bottom: 1px solid #f1f5f9;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
        }
        .sidebar a {
            color: #64748b;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 16px;
            margin-bottom: 4px;
            border-radius: 10px;
            font-weight: 500;
            font-size: 0.92rem;
            transition: all 0.2s ease;
        }
        .sidebar a:hover, .sidebar a.active {
            background-color: #ecfdf5;
            color: #047857;
            font-weight: 600;
        }
        /* Layout Alignment */
        .main-wrapper {
            margin-left: 250px;
            width: calc(100% - 250px);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        .main-content {
            padding: 32px;
            flex: 1;
        }
        /* Footer Styling */
        .dashboard-footer {
            background-color: #ffffff;
            border-top: 1px solid #e2e8f0;
            padding: 16px 32px;
            margin-top: auto;
            font-size: 0.85rem;
            color: #64748b;
        }
        @media (max-width: 768px) {
            .sidebar {
                width: 100%;
                height: auto;
                position: relative;
            }
            .main-wrapper {
                margin-left: 0;
                width: 100%;
            }
        }
    </style>
    {% block extra_css %}{% endblock %}
</head>
<body>

<div class="dashboard-container">
    <!-- Sidebar Navigation -->
    <div class="sidebar">
        <div class="sidebar-brand">
            🥦 AI Shelf Life <br>
            <small class="text-muted fw-normal" style="font-size:0.75rem;">Predictor System</small>
        </div>
        <a href="{{ url_for('dashboard') }}" class="{% if request.endpoint == 'dashboard' %}active{% endif %}">
            <i class="fa-solid fa-chart-line"></i> Dashboard
        </a>
        <a href="{{ url_for('add_product') }}" class="{% if request.endpoint == 'add_product' %}active{% endif %}">
            <i class="fa-solid fa-plus"></i> Add Product
        </a>
        <a href="{{ url_for('product_list') }}" class="{% if request.endpoint == 'product_list' %}active{% endif %}">
            <i class="fa-solid fa-list-check"></i> Product List
        </a>
        <a href="{{ url_for('ai_prediction') }}" class="{% if request.endpoint == 'ai_prediction' %}active{% endif %}">
            <i class="fa-solid fa-robot"></i> AI Prediction
        </a>
        <a href="{{ url_for('notifications') }}" class="{% if request.endpoint == 'notifications' %}active{% endif %}">
            <i class="fa-solid fa-bell"></i> Notifications
        </a>
        <a href="{{ url_for('profile') }}" class="{% if request.endpoint == 'profile' %}active{% endif %}">
            <i class="fa-solid fa-user"></i> Profile
        </a>
        <hr class="mx-2 my-auto text-muted">
        <a href="{{ url_for('index') }}" class="text-danger">
            <i class="fa-solid fa-right-from-bracket"></i> Logout
        </a>
    </div>

    <!-- Main Content Wrapper -->
    <div class="main-wrapper">
        <div class="main-content">
            {% block content %}{% endblock %}
        </div>

        <!-- Shared Footer Section -->
        <footer class="dashboard-footer text-center text-md-between d-flex flex-column flex-md-row justify-content-between align-items-center gap-2">
            <div>
                © 2026 <strong>AI Shelf Life Predictor</strong>. All rights reserved.
            </div>
            <div>
                <span class="badge bg-success bg-opacity-10 text-success rounded-pill px-3 py-1">System Status: Active</span>
            </div>
        </footer>
    </div>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
{% block extra_js %}{% endblock %}
</body>
</html>
