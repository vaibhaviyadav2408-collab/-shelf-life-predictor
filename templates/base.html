<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}AI Shelf Life Predictor{% endblock %}</title>

    <!-- Bootstrap 5 CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome Icons CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --sidebar-width: 260px;
            --primary-green: #10b981;
            --primary-dark: #0f172a;
        }

        body {
            background-color: #f1f5f9;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            margin: 0;
            overflow-x: hidden;
        }

        /* Modern Sidebar */
        .sidebar {
            width: var(--sidebar-width);
            height: 100vh;
            position: fixed;
            top: 0;
            left: 0;
            background: #0f172a;
            color: #ffffff;
            padding: 24px 16px;
            display: flex;
            flex-direction: column;
            z-index: 1000;
            box-shadow: 4px 0 15px rgba(0,0,0,0.05);
        }

        .sidebar-brand {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--primary-green);
            margin-bottom: 30px;
            padding: 0 12px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .sidebar-nav {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .sidebar a {
            color: #94a3b8;
            text-decoration: none;
            padding: 12px 16px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            gap: 12px;
            font-weight: 500;
            font-size: 0.95rem;
            transition: all 0.2s ease;
        }

        .sidebar a:hover {
            background: #1e293b;
            color: #ffffff;
        }

        .sidebar a.active {
            background: var(--primary-green);
            color: #ffffff;
            font-weight: 600;
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3);
        }

        /* Main View Container */
        .main-content {
            margin-left: var(--sidebar-width);
            padding: 32px;
            min-height: 100vh;
        }

        .card-custom {
            border: none;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.03);
            background: #ffffff;
        }

        /* AI Floating Chatbot */
        .chat-btn {
            position: fixed;
            bottom: 30px;
            right: 30px;
            width: 56px;
            height: 56px;
            background: var(--primary-green);
            color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            cursor: pointer;
            box-shadow: 0 8px 24px rgba(16, 185, 129, 0.35);
            border: none;
            z-index: 1050;
            transition: transform 0.2s;
        }

        .chat-btn:hover {
            transform: scale(1.05);
        }

        .chat-box {
            position: fixed;
            bottom: 100px;
            right: 30px;
            width: 360px;
            height: 450px;
            background: #ffffff;
            border-radius: 18px;
            box-shadow: 0 12px 35px rgba(0,0,0,0.15);
            display: none;
            flex-direction: column;
            overflow: hidden;
            z-index: 1050;
            border: 1px solid #e2e8f0;
        }

        .chat-header {
            background: var(--primary-dark);
            color: white;
            padding: 16px;
            font-weight: 600;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .chat-body {
            flex: 1;
            padding: 16px;
            overflow-y: auto;
            background: #f8fafc;
        }

        .chat-msg {
            margin-bottom: 12px;
            max-width: 82%;
            padding: 10px 14px;
            border-radius: 14px;
            font-size: 13.5px;
            line-height: 1.45;
        }

        .msg-bot {
            background: #ffffff;
            color: #1e293b;
            align-self: flex-start;
            border-bottom-left-radius: 2px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.04);
        }

        .msg-user {
            background: var(--primary-green);
            color: white;
            margin-left: auto;
            border-bottom-right-radius: 2px;
        }

        .chat-footer {
            padding: 12px;
            background: white;
            border-top: 1px solid #e2e8f0;
            display: flex;
            gap: 8px;
        }
    </style>
    {% block extra_css %}{% endblock %}
</head>
<body>

<div class="sidebar">
    <div class="sidebar-brand">
        <i class="fa-solid fa-leaf"></i>
        <span>AI Shelf Life</span>
    </div>
    
    <div class="sidebar-nav">
        <a href="/dashboard" class="{% if 'dashboard' in request.path or request.path == '/' %}active{% endif %}">
            <i class="fa-solid fa-chart-pie"></i> Dashboard
        </a>
        <a href="/add-product" class="{% if 'add' in request.path %}active{% endif %}">
            <i class="fa-solid fa-square-plus"></i> Add Product
        </a>
        <a href="/product-list" class="{% if 'product' in request.path and 'add' not in request.path %}active{% endif %}">
            <i class="fa-solid fa-boxes-packing"></i> Product Inventory
        </a>
        <a href="/ai-prediction" class="{% if 'prediction' in request.path %}active{% endif %}">
            <i class="fa-solid fa-wand-magic-sparkles"></i> AI Prediction
        </a>
        <a href="/notifications" class="{% if 'notifications' in request.path %}active{% endif %}">
            <i class="fa-solid fa-bell"></i> Notifications
        </a>
        <a href="/profile" class="{% if 'profile' in request.path %}active{% endif %}">
            <i class="fa-solid fa-user-gear"></i> Account Profile
        </a>
    </div>

    <a href="/logout" class="mt-auto text-danger-subtle"><i class="fa-solid fa-right-from-bracket"></i> Logout</a>
</div>

<div class="main-content">
    {% block content %}{% endblock %}
</div>

<button class="chat-btn" onclick="toggleChat()"><i class="fa-solid fa-robot"></i></button>

<div class="chat-box" id="chatBox">
    <div class="chat-header">
        <span><i class="fa-solid fa-robot text-success me-2"></i> AI Assistant</span>
        <i class="fa-solid fa-xmark" style="cursor:pointer;" onclick="toggleChat()"></i>
    </div>
    <div class="chat-body d-flex flex-column" id="chatMessages">
        <div class="chat-msg msg-bot">Hello! 👋 Ask me anything about food preservation or expiry dates.</div>
    </div>
    <div class="chat-footer">
        <input type="text" id="chatInput" class="form-control form-control-sm border-0 bg-light" placeholder="Ask a question..." onkeypress="handleKey(event)">
        <button class="btn btn-sm btn-success px-3" onclick="sendMessage()"><i class="fa-solid fa-paper-plane"></i></button>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    function toggleChat() {
        const box = document.getElementById('chatBox');
        box.style.display = (box.style.display === 'flex') ? 'none' : 'flex';
    }
    function handleKey(e) { if (e.key === 'Enter') sendMessage(); }
    async function sendMessage() {
        const input = document.getElementById('chatInput');
        const text = input.value.trim();
        if (!text) return;

        const container = document.getElementById('chatMessages');
        const userDiv = document.createElement('div');
        userDiv.className = 'chat-msg msg-user';
        userDiv.innerText = text;
        container.appendChild(userDiv);
        input.value = '';
        container.scrollTop = container.scrollHeight;

        try {
            const res = await fetch('/chat', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ message: text })
            });
            const data = await res.json();
            const botDiv = document.createElement('div');
            botDiv.className = 'chat-msg msg-bot';
            botDiv.innerText = data.reply;
            container.appendChild(botDiv);
            container.scrollTop = container.scrollHeight;
        } catch (err) { console.error(err); }
    }
</script>
</body>
</html>
