<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Shelf Life Predictor</title>
    
    <!-- Bootstrap 5 CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        body {
            background-color: #f1f5f9;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            margin: 0;
            padding: 0;
        }
        
        /* Dark Sidebar Styling */
        .sidebar {
            width: 260px;
            height: 100vh;
            position: fixed;
            top: 0;
            left: 0;
            background: linear-gradient(180deg, #0f172a 0%, #1e293b 100%);
            color: #ffffff;
            padding: 24px 16px;
            display: flex;
            flex-direction: column;
            z-index: 1000;
            box-shadow: 4px 0 10px rgba(0,0,0,0.05);
        }
        
        .sidebar-brand {
            font-size: 1.35rem;
            font-weight: 700;
            color: #10b981;
            margin-bottom: 30px;
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
            padding-left: 10px;
        }
        
        .sidebar a {
            color: #94a3b8;
            text-decoration: none;
            padding: 12px 16px;
            border-radius: 10px;
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            gap: 12px;
            font-weight: 500;
            transition: all 0.2s ease;
        }
        
        .sidebar a:hover, .sidebar a.active {
            background: #10b981;
            color: #ffffff;
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3);
        }
        
        /* Main Layout */
        .main-wrapper {
            margin-left: 260px;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        
        .main-content {
            padding: 35px;
            flex: 1;
        }
        
        /* Modern Cards */
        .card-custom {
            border: none;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.04);
            background: #ffffff;
        }

        .btn-success-custom {
            background-color: #10b981;
            border: none;
            color: white;
            font-weight: 600;
            border-radius: 8px;
            padding: 10px 20px;
            transition: all 0.2s;
        }

        .btn-success-custom:hover {
            background-color: #059669;
            color: white;
        }
    </style>
</head>
<body>

    <!-- Sidebar -->
    <div class="sidebar">
        <a href="{{ url_for('dashboard') }}" class="sidebar-brand">
            <i class="fa-solid fa-leaf text-success"></i> AI Shelf Life
        </a>
        <a href="{{ url_for('dashboard') }}"><i class="fa-solid fa-chart-pie"></i> Dashboard</a>
        <a href="{{ url_for('add_product') }}"><i class="fa-solid fa-plus-circle"></i> Add Product</a>
        <a href="{{ url_for('product_list') }}"><i class="fa-solid fa-list text-center"></i> Product List</a>
        <a href="{{ url_for('ai_prediction') }}"><i class="fa-solid fa-robot"></i> AI Prediction</a>
        <a href="{{ url_for('chatbot') }}"><i class="fa-solid fa-comments"></i> AI Chatbot</a>
        <a href="{{ url_for('notifications') }}"><i class="fa-solid fa-bell"></i> Notifications</a>
        <a href="{{ url_for('profile') }}"><i class="fa-solid fa-user"></i> Profile</a>
        <a href="{{ url_for('index') }}" class="mt-auto text-danger"><i class="fa-solid fa-right-from-bracket"></i> Logout</a>
    </div>

    <!-- Main Content Body -->
    <div class="main-wrapper">
        <div class="main-content">
            {% block content %}{% endblock %}
        </div>

        <!-- Stylish Vertical Footer -->
        <footer class="py-4 bg-dark text-white text-center border-top border-secondary mt-auto">
            <div class="container d-flex flex-column align-items-center gap-1">
                <p class="mb-0 fw-bold text-success fs-5">Developed by Vaibhavi Yadav</p>
                <p class="mb-0 text-light fw-semibold">KBP Polytechnic, Satara</p>
                <p class="mb-0 text-muted small">2026 Inplant Training Project</p>
            </div>
        </footer>
    </div>

    <!-- Bootstrap 5 JS Bundle CDN -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
