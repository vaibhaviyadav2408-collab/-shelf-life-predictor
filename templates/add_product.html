<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Product - AI Shelf Life</title>
    <!-- Google Fonts & Font Awesome Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <!-- Sidebar Navigation -->
    <div class="sidebar">
        <div class="sidebar-brand">
            <i class="fa-solid fa-leaf text-success me-2"></i>AI Shelf Life
        </div>
        <a href="{{ url_for('dashboard') }}"><i class="fa-solid fa-chart-pie"></i> Dashboard</a>
        <a href="{{ url_for('add_product') }}" class="active"><i class="fa-solid fa-plus-circle"></i> Add Product</a>
        <a href="{{ url_for('product_list') }}"><i class="fa-solid fa-boxes-stacked"></i> Product List</a>
        <a href="{{ url_for('ai_prediction') }}"><i class="fa-solid fa-robot"></i> AI Prediction</a>
        <a href="{{ url_for('notifications') }}"><i class="fa-solid fa-bell"></i> Notifications</a>
        <a href="{{ url_for('profile') }}"><i class="fa-solid fa-user"></i> Profile</a>
        <a href="{{ url_for('admin') }}"><i class="fa-solid fa-gear"></i> Admin</a>
    </div>

    <!-- Main Content Area -->
    <div class="main-content">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h3 class="fw-bold mb-1">✨ Add New Product</h3>
                <p class="text-muted mb-0">Fill in details to track shelf life and freshness.</p>
            </div>
        </div>

        <div class="card card-custom p-4 p-md-5" style="max-width: 650px;">
            <form action="{{ url_for('add_product') }}" method="POST" enctype="multipart/form-data">
                
                <div class="mb-4">
                    <label class="form-label fw-semibold"><i class="fa-solid fa-tag text-muted me-2"></i>Product Name</label>
                    <input type="text" name="product_name" class="form-control form-control-lg fs-6" placeholder="e.g. Organic Fresh Milk 1L" required>
                </div>

                <div class="mb-4">
                    <label class="form-label fw-semibold"><i class="fa-solid fa-layer-group text-muted me-2"></i>Category</label>
                    <select name="category" class="form-select form-select-lg fs-6">
                        <option value="Dairy">🥛 Dairy</option>
                        <option value="Bakery">🍞 Bakery</option>
                        <option value="Fruits">🍎 Fruits</option>
                        <option value="Vegetables">🥦 Vegetables</option>
                    </select>
                </div>

                <div class="row mb-4">
                    <div class="col-md-6 mb-3 mb-md-0">
                        <label class="form-label fw-semibold"><i class="fa-solid fa-calendar-day text-muted me-2"></i>Manufacturing Date</label>
                        <input type="date" name="mfg_date" class="form-control" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-semibold"><i class="fa-solid fa-calendar-xmark text-muted me-2"></i>Expiry Date</label>
                        <input type="date" name="exp_date" class="form-control" required>
                    </div>
                </div>

                <button type="submit" class="btn btn-green w-100 py-3 font-weight-bold fs-6 mt-2 shadow-sm">
                    <i class="fa-solid fa-floppy-disk me-2"></i>Save Product
                </button>

            </form>
        </div>
    </div>

</body>
</html>
