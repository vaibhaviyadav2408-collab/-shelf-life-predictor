<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - AI Shelf Life Predictor</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}?v=4.0">
    <style>
        body {
            background-color: #f8fafc;
            font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
            color: #1e293b;
        }
        .auth-card-wrapper {
            background: #ffffff;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.08);
            overflow: hidden;
            border: 1px solid rgba(226, 232, 240, 0.8);
        }
        .auth-banner {
            background: linear-gradient(135deg, #047857 0%, #10b981 100%);
        }
        .input-group-text {
            background-color: #f8fafc;
            border-right: none;
            color: #64748b;
        }
        .form-control-icon {
            border-left: none;
        }
        .form-control-icon:focus {
            border-color: #cbd5e1;
            box-shadow: none;
        }
        .input-group:focus-within .input-group-text,
        .input-group:focus-within .form-control-icon {
            border-color: #10b981;
        }
        .btn-green {
            background-color: #10b981;
            color: #ffffff;
            border: none;
            border-radius: 10px;
            font-weight: 600;
            transition: background 0.2s ease;
        }
        .btn-green:hover {
            background-color: #047857;
            color: #ffffff;
        }
    </style>
</head>
<body class="bg-light d-flex flex-column min-vh-100 justify-content-between py-4">

<div class="container my-auto">
    <div class="row justify-content-center">
        <div class="col-lg-10 col-xl-9">
            <div class="auth-card-wrapper">
                <div class="row g-0">
                    <!-- Left Banner -->
                    <div class="col-md-5 auth-banner text-center p-4 p-lg-5 d-flex flex-column justify-content-center align-items-center">
                        <a href="{{ url_for('index') }}" class="text-white text-decoration-none mb-4 d-inline-block opacity-75 hover-opacity-100">
                            <i class="fa-solid fa-arrow-left me-1"></i> Back to Home
                        </a>
                        <img src="https://cdn-icons-png.flaticon.com/512/3081/3081986.png" width="140" class="mb-4" alt="Basket Icon">
                        <h3 class="fw-bold text-white mb-2">Welcome Back!</h3>
                        <p class="text-white-50 fs-6 mb-0">Login to manage your food items smartly and prevent waste with AI predictions.</p>
                    </div>

                    <!-- Right Form Container -->
                    <div class="col-md-7 bg-white p-4 p-md-5 d-flex align-items-center">
                        <div class="w-100 max-w-md mx-auto">
                            <div class="mb-4">
                                <h3 class="fw-bold text-dark m-0">Sign In</h3>
                                <p class="text-muted small">Enter your credentials to access your account</p>
                            </div>
                            
                            <form action="{{ url_for('login') }}" method="POST">
                                <div class="mb-3">
                                    <label class="form-label fw-semibold text-secondary small">Email Address</label>
                                    <div class="input-group">
                                        <span class="input-group-text"><i class="fa-regular fa-envelope"></i></span>
                                        <input type="email" name="email" class="form-control form-control-icon" placeholder="name@example.com" required>
                                    </div>
                                </div>
                                
                                <div class="mb-4">
                                    <div class="d-flex justify-content-between align-items-center mb-1">
                                        <label class="form-label fw-semibold text-secondary small mb-0">Password</label>
                                    </div>
                                    <div class="input-group">
                                        <span class="input-group-text"><i class="fa-solid fa-lock"></i></span>
                                        <input type="password" name="password" class="form-control form-control-icon" placeholder="Enter password" required>
                                    </div>
                                </div>
                                
                                <button type="submit" class="btn-green w-100 py-3 mb-3">
                                    Login <i class="fa-solid fa-right-to-bracket ms-1"></i>
                                </button>
                            </form>
                            
                            <p class="text-center text-muted small m-0">
                                Don't have an account? 
                                <a href="{{ url_for('register') }}" class="text-success fw-bold text-decoration-none">Register here</a>
                            </p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Shared Footer Include -->
{% include 'footer.html' %}

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
