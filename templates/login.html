<!DOCTYPE html>
<html lang="en">
<head>
    <title>Login - AI Shelf Life</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<div class="container-fluid p-0">
    <div class="row g-0 auth-box">
        <div class="col-md-6 auth-banner text-center">
            <img src="https://cdn-icons-png.flaticon.com/512/3081/3081986.png" width="220" class="mb-4" alt="Basket">
            <h2 class="fw-bold">Welcome Back!</h2>
            <p class="text-light">Login to continue and manage your food items smartly.</p>
        </div>

        <div class="col-md-6 auth-form-container bg-white">
            <div style="width: 360px;">
                <h3 class="fw-bold text-dark mb-4">Login</h3>
                <form action="{{ url_for('login') }}" method="POST">
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Email</label>
                        <input type="email" name="email" class="form-control p-2" placeholder="Enter your email" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Password</label>
                        <input type="password" name="password" class="form-control p-2" placeholder="Enter your password" required>
                    </div>
                    <button type="submit" class="btn btn-green w-100 py-2 mt-2">Login</button>
                </form>
                <p class="mt-4 text-center text-muted">Don't have an account? <a href="{{ url_for('register') }}" class="text-success fw-bold">Register</a></p>
            </div>
        </div>
    </div>
</div>
</body>
</html>
