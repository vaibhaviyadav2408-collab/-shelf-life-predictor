<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Profile - AI Shelf Life Predictor</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #f1f5f9; font-family: 'Segoe UI', sans-serif; padding: 30px; }
        .card-custom { border: none; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.04); background: #ffffff; }
    </style>
</head>
<body>
<div class="container-fluid style-container" style="max-width: 700px;">
    <h3 class="fw-bold text-dark mb-4">Account Profile</h3>
    <div class="card card-custom p-4">
        <div class="d-flex align-items-center gap-3 mb-4 border-bottom pb-3">
            <div class="bg-success text-white rounded-circle d-flex align-items-center justify-content-center fw-bold fs-3" style="width: 64px; height: 64px;">
                U
            </div>
            <div>
                <h5 class="fw-bold text-dark mb-0">Admin / User Profile</h5>
                <span class="badge bg-success-subtle text-success border">Active Account</span>
            </div>
        </div>
        <form action="/profile" method="POST">
            <div class="mb-3">
                <label class="form-label fw-semibold">Full Name</label>
                <input type="text" class="form-control" value="Project Manager" name="name">
            </div>
            <div class="mb-3">
                <label class="form-label fw-semibold">Email Address</label>
                <input type="email" class="form-control" value="user@aishelflife.com" name="email" readonly>
            </div>
            <div class="mb-4">
                <label class="form-label fw-semibold">Notification Preference</label>
                <select class="form-select" name="notifications_pref">
                    <option value="email">Email & App Alerts</option>
                    <option value="app">App Only</option>
                </select>
            </div>
            <button type="submit" class="btn btn-success rounded-pill px-4">Update Details</button>
        </form>
    </div>
</div>
</body>
</html>
