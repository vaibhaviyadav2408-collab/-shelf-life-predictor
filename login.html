<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - AI Shelf Life</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="auth-body">

<div class="auth-card">
    <div class="row g-0 h-100">
        <div class="col-md-5 auth-banner d-flex flex-column align-items-center justify-content-center text-center p-4">
            <img src="https://cdn-icons-png.flaticon.com/512/3081/3081986.png" width="160" class="mb-3 alt-img" alt="Basket Icon">
            <h2 class="fw-bold text-white mb-2">Welcome Back!</h2>
            <p class="text-white-50 fs-6">Login to continue and manage your food items smartly.</p>
        </div>

        <div class="col-md-7 auth-form-container bg-white d-flex align-items-center justify-content-center p-4 p-md-5">
            <div class="w-100" style="max-width: 360px;">
                <h3 class="fw-bold text-dark mb-4 text-center text-md-start">Login</h3>
                
                <form action="{{ url_for('login') }}" method="POST">
                    <div class="mb-3">
                        <label class="form-label fw-semibold text-secondary">Email</label>
                        <input type="email" name="email" class="form-control custom-input" placeholder="Enter your email" required>
                    </div>
                    
                    <div class="mb-4">
                        <label class="form-label fw-semibold text-secondary">Password</label>
                        <input type="password" name="password" class="form-control custom-input" placeholder="Enter your password" required>
                    </div>
                    
                    <button type="submit" class="btn btn-custom-green w-100 py-2">Login</button>
                </form>
                
                <p class="mt-4 text-center text-muted">
                    Don't have an account? <a href="{{ url_for('register') }}" class="text-success fw-bold text-decoration-none">Register</a>
                </p>
            </div>
        </div>
    </div>
</div>

</body>
</html>
